<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>docsify</title>
    <link rel="icon" href="_media/favicon.ico" />
    <meta
      name="google-site-verification"
      content="6t0LoIeFksrjF4c9sqUEsVXiQNxLp2hgoqo0KryT-sE"
    />
    <meta
      name="keywords"
      content="doc,docs,documentation,gitbook,creator,generator,github,jekyll,github-pages"
    />
    <meta name="description" content="A magical documentation generator." />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Core Theme -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
    />

    <!-- Theme Add-on(s) -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css"
      data-group="addon"
      data-sheet="vue"
      disabled
    />

    <!-- Prism Theme -->
    <!-- <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-twilight.min.css"
    /> -->

    <!-- Site styles -->
    <style>
      /* Plugin: Carbon Ads */
      #carbonads > :last-child {
        margin-block: calc((1em * var(--line-height)) / 2);
      }

      /* UI Kit */
      .ui-kit-color {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: var(--font-size-s);
      }

      .ui-kit-color figure {
        flex-grow: 1;
        margin: 0;
        padding: 0;
      }

      .ui-kit-color figure div {
        height: 4rem;
        border-radius: var(--border-radius);
      }

      .ui-kit-color figcaption {
        text-align: center;
        padding: 0.5em 0;
      }
    </style>
    <script>
      // Set html "lang" attribute based on URL
      (function () {
        const lang = location.hash.match(/#\/(vi)\//);

        if (lang) {
          document.documentElement.setAttribute('lang', lang[1]);
        }
      })();
    </script>
  </head>

  <body class="loading sidebar-chevron-right sidebar-group-box">
    <div id="app"></div>
    <script>
      // Docsify configuration
      window.$docsify = {
        auto2top: true,
        homepage: 'introduction.md',
        coverpage: false,
        executeScript: true,
        loadSidebar: true,
        loadNavbar: true,
        maxLevel: 4,
        // repo: 'docsifyjs/docsify',
        // routerMode: 'history',
        subMaxLevel: 2,
        gtag: 'G-H77Y58DS3L',
        name: 'Browgate Docs',
        nameLink: {
          '/vi/': '#/vi/',
          '/': '#/',
        },
        search: {
          // insertAfter: '.app-name',
          // insertBefore: '.sidebar-nav',
          noData: {
            '/vi/': 'Không tìm thấy kết quả!',
            '/': 'No results!',
          },
          paths: 'auto',
          placeholder: {
            '/vi/': 'Tìm kiếm',
            '/': 'Search',
          },
          pathNamespaces: ['/vi'],
          depth: 6,
        },
        skipLink: {
          '/vi/': 'Chuyển đến nội dung chính',
        },
        vueComponents: {
          'button-counter': {
            template: /* html */ `<button @click="count += 1">You clicked me {{ count }} times</button>`,
            data() {
              return {
                count: 0,
              };
            },
          },
        },
        vueGlobalOptions: {
          data() {
            return {
              count: 0,
              message: 'Hello, World!',
              // Fake API response
              images: [
                { title: 'Image 1', url: 'https://picsum.photos/150?random=1' },
                { title: 'Image 2', url: 'https://picsum.photos/150?random=2' },
                { title: 'Image 3', url: 'https://picsum.photos/150?random=3' },
              ],
            };
          },
          computed: {
            timeOfDay() {
              const date = new Date();
              const hours = date.getHours();

              if (hours < 12) {
                return 'morning';
              } else if (hours < 18) {
                return 'afternoon';
              } else {
                return 'evening';
              }
            },
          },
          methods: {
            hello() {
              alert(this.message);
            },
          },
        },
        vueMounts: {
          '#counter': {
            data() {
              return {
                count: 0,
              };
            },
          },
        },
        plugins: [
          // Plugin: Footer
          function (hook, vm) {
            hook.beforeEach(html => {
              if (/githubusercontent\.com/.test(vm.route.file)) {
                url = vm.route.file
                  .replace('raw.githubusercontent.com', 'github.com')
                  .replace(/\/master/, '/blob/master')
                  .replace(/\/main/, '/blob/main');
              } else if (/jsdelivr\.net/.test(vm.route.file)) {
                url = vm.route.file
                  .replace('cdn.jsdelivr.net/gh', 'github.com')
                  .replace('@main', '/blob/main');
              } else {
                url =
                  'https://github.com/docsifyjs/docsify/blob/develop/docs/' +
                  vm.route.file;
              }

              const footerHTML = [
                '<hr>',
                '<div style="display: flex; align-items: center; justify-content: space-between;">',
                '  <span>Powered by <a href="/">Docsify.js</a></span>',
                `  <a href="${url}" style="display: inline-flex; align-items: center; gap: 0.25em;">:memo: Edit Page</a>`,
                '</div>',
              ].join('\n');

              // Keep the injected footer outside fenced Markdown code blocks.
              return html.replace(/\s*$/, '\n\n') + footerHTML;
            });
          },
        ],
      };
    </script>
    <script>
      // Language switcher
      (function () {
        const languages = [
          { code: 'en', label: 'English', path: '/' },
          { code: 'vi', label: 'Tiếng Việt', path: '/vi/' },
        ];

        function getLanguage() {
          return location.hash.startsWith('#/vi/') ? 'vi' : 'en';
        }

        function getCurrentPage() {
          const hash = location.hash.replace(/^#\/?/, '');
          return hash.replace(/^vi\//, '') || 'installation.md';
        }

        function switchLanguage(code) {
          const language = languages.find(item => item.code === code);
          if (!language) return;

          const page = getCurrentPage();
          location.hash = code === 'en' ? `#/${page}` : `#/vi/${page}`;
        }

        function renderLanguageSwitcher() {
          const nav = document.querySelector('.app-nav');
          if (!nav || nav.querySelector('.language-switcher')) return;

          const wrapper = document.createElement('li');
          wrapper.className = 'language-switcher';

          const select = document.createElement('select');
          select.setAttribute('aria-label', 'Language');

          languages.forEach(language => {
            const option = document.createElement('option');
            option.value = language.code;
            option.textContent = language.label;
            option.selected = language.code === getLanguage();
            select.appendChild(option);
          });

          select.addEventListener('change', event => {
            switchLanguage(event.target.value);
          });

          wrapper.appendChild(select);
          nav.appendChild(wrapper);
        }

        document.addEventListener('DOMContentLoaded', renderLanguageSwitcher);
        window.addEventListener('hashchange', () => {
          setTimeout(renderLanguageSwitcher, 0);
        });
      })();
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/front-matter.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/gtag.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-nginx.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
